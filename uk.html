<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study in UK | FE Destination Pvt Ltd</title>
    <meta name="description"
        content="Study in the United Kingdom — entry requirements, study locations and guidance for international students.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/countries.css">
</head>

<body>

    <section class="country-page">
        <div class="country-container">

            <a href="index.html#destinations" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Home
            </a>

            <h1>Study in the United Kingdom 🇬🇧</h1>

            <div class="country-hero-img-container">
                <img src="https://images.pexels.com/photos/460672/pexels-photo-460672.jpeg" class="country-hero-img"
                    alt="London Big Ben">
            </div>

            <div class="country-details-grid">

                <div class="country-card">
                    <h3>🎓 Entry Requirements</h3>
                    <ul>
                        <li>12 Years of Education (FSc / A-Levels).</li>
                        <li>IELTS: Minimum 6.0 – 6.5 bands.</li>
                        <li>Statement of Purpose (SOP) is mandatory.</li>
                    </ul>
                </div>

                <div class="country-card">
                    <h3>🏙️ Famous Locations</h3>
                    <p>
                        London, Manchester, Edinburgh, and Birmingham are hubs for
                        international students.
                    </p>
                </div>

            </div>

        </div>
    </section>

</body>

</html>
